name: CI

on:
  push:
    branches: ["*"]
    tags: ["v*"]
  pull_request:

jobs:
  # Build, smoke-test, and produce the static binary
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: crystallang/crystal:latest-alpine
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: apk add --no-cache cmake make g++ zlib-dev zlib-static libpng-dev libpng-static

      - name: Build and install libharu as a static library
        run: |
          wget -q https://github.com/libharu/libharu/archive/refs/tags/v2.4.5.tar.gz
          tar xzf v2.4.5.tar.gz
          cmake -S libharu-2.4.5 -B libharu-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build libharu-build --parallel
          cmake --install libharu-build

      - name: Install dependencies
        run: shards install --frozen

      - name: Build static binary
        run: shards build --release --no-debug --static

      - name: Smoke-test — generate example invoice
        run: ./bin/invoicegenerator --show-yml-example | ./bin/invoicegenerator --stdin --output invoice.pdf

      - name: Verify output is a valid PDF
        run: grep -qc "^%PDF" invoice.pdf

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: invoicegenerator-linux-x86_64
          path: bin/invoicegenerator
          if-no-files-found: error

  # Build, smoke-test, and produce the macOS arm64 binary
  build-macos:
    name: Build (macOS arm64)
    runs-on: macos-15 # arm64 (Apple Silicon)
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: brew install crystal cmake libpng bdw-gc pcre2 libevent libyaml

      - name: Build and install libharu as a static library
        run: |
          curl -sSL -o v2.4.5.tar.gz https://github.com/libharu/libharu/archive/refs/tags/v2.4.5.tar.gz
          tar xzf v2.4.5.tar.gz
          cmake -S libharu-2.4.5 -B libharu-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_PREFIX_PATH="$(brew --prefix libpng)" \
            -DCMAKE_INSTALL_PREFIX="$PWD/deps"
          cmake --build libharu-build --parallel
          cmake --install libharu-build

      # macOS has no static libSystem, so `--static` is unavailable. Instead,
      # collect the static archives of every non-system dependency into a single
      # directory. The linker checks each -L directory for .dylib before .a, so
      # this directory must contain *only* archives for them to win.
      - name: Stage static libraries
        run: |
          # Homebrew ships these read-only; install(1) keeps re-runs idempotent.
          install -m 0644 "$(brew --prefix libpng)/lib/libpng.a" deps/lib/
          install -m 0644 "$(brew --prefix bdw-gc)/lib/libgc.a" deps/lib/
          install -m 0644 "$(brew --prefix pcre2)/lib/libpcre2-8.a" deps/lib/
          install -m 0644 "$(brew --prefix libevent)/lib/libevent.a" deps/lib/
          install -m 0644 "$(brew --prefix libevent)/lib/libevent_pthreads.a" deps/lib/
          install -m 0644 "$(brew --prefix libyaml)/lib/libyaml.a" deps/lib/
          ls -l deps/lib

      - name: Install dependencies
        run: shards install --frozen

      - name: Build binary
        env:
          # Ours first so archives are preferred; Homebrew last as a fallback,
          # which the otool check below turns into a hard failure if hit.
          CRYSTAL_LIBRARY_PATH: ${{ github.workspace }}/deps/lib:/opt/homebrew/lib
        run: shards build --release --no-debug

      - name: Verify no Homebrew libraries are linked dynamically
        run: |
          otool -L bin/invoicegenerator
          if otool -L bin/invoicegenerator | grep -E "/opt/homebrew|/usr/local"; then
            echo "::error::Binary links a non-system dylib and is not self-contained"
            exit 1
          fi

      - name: Smoke-test — generate example invoice
        run: ./bin/invoicegenerator --show-yml-example | ./bin/invoicegenerator --stdin --output invoice.pdf

      - name: Verify output is a valid PDF
        run: grep -qc "^%PDF" invoice.pdf

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: invoicegenerator-macos-arm64
          path: bin/invoicegenerator
          if-no-files-found: error

  # Ameba linter
  lint:
    name: Ameba linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Ameba
        uses: crystal-ameba/github-action@v0.12.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # GitHub release (on version tags only)
  release:
    name: Create GitHub release
    needs: [build, build-macos, lint]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux binary
        uses: actions/download-artifact@v8
        with:
          name: invoicegenerator-linux-x86_64
          path: linux-x86_64

      - name: Download macOS binary
        uses: actions/download-artifact@v8
        with:
          name: invoicegenerator-macos-arm64
          path: macos-arm64

      # Artifact upload does not preserve the executable bit.
      - name: Compress binaries
        run: |
          for target in linux-x86_64 macos-arm64; do
            chmod +x "$target/invoicegenerator"
            tar -czf "invoicegenerator-$target.tar.gz" -C "$target" invoicegenerator
          done

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            invoicegenerator-linux-x86_64.tar.gz
            invoicegenerator-macos-arm64.tar.gz
          generate_release_notes: true
